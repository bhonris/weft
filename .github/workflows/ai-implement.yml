name: AI implement

# Issue-driven autonomous development (documents/ai-managed-repo.md).
# An owner-opened issue triggers Claude Code headless, which implements the
# change per CLAUDE.md and opens a PR. ci.yml is the merge gate, not this job.

on:
  issues:
    types: [opened]

# Least privilege: the job reads the repo with GITHUB_TOKEN and does all writes
# with the scoped App token, which is what makes ci.yml run on the bot's commits.
permissions:
  contents: read

jobs:
  implement:
    name: implement issue
    # The owner gate is load-bearing. It keeps a third party from triggering a
    # run, and keeps the subscription credential in the secret spendable only by
    # the account holder. Do not relax it without re-reading the Security
    # section of documents/ai-managed-repo.md.
    if: github.event.issue.user.login == github.repository_owner
    # anthropics/claude-code-action's installer does not support Windows
    # runners ("Windows is not supported by this script") — confirmed by a
    # startup_failure dry run. That's fine here: this job only runs
    # `pnpm typecheck`/`pnpm test:cov` (per CLAUDE.md, native node-pty and
    # e2e are excluded from the unit gate), so it never needs the Windows
    # toolchain ci.yml's e2e job requires.
    runs-on: ubuntu-latest
    # Bounds a runaway run's burn on the shared weekly quota.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # A dedicated App (not GITHUB_TOKEN) so pushes from this job DO trigger
      # ci.yml on the resulting PR. GITHUB_TOKEN-authored commits do not.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Mirrors ci.yml so the agent's local gate matches the one that judges it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Mark issue as in progress
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit ${{ github.event.issue.number }} --add-label "ai:working"

      - name: Implement
        id: implement
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # branch_prefix only intercepts the action's OWN structured git
          # tooling. Confirmed on issue #23/PR #24: the agent instead ran raw
          # `git checkout -b feat/...` via the Bash tool, which branch_prefix
          # has no chance to touch -- the PR landed off the `ai/` prefix
          # ai-review.yml's `startsWith(github.head_ref, 'ai/')` gate requires,
          # so it could never be self-reviewed or auto-merged. Keep this AND
          # the explicit prompt instruction below -- belt and suspenders,
          # since neither alone has proven sufficient.
          branch_prefix: "ai/issue-${{ github.event.issue.number }}-"
          # In a headless CI run there's no human to approve a tool-use prompt,
          # so an unlisted tool is auto-denied rather than asked about. Without
          # this, a dry run completed all 21 turns and reported success with
          # 10 permission denials and no branch/PR/comment to show for it --
          # every Bash/Edit call needed to actually do the work was refused.
          # 30 was enough for a single-file doc change (13-21 turns observed)
          # but not for a real feature spanning persistence/main/renderer/UI:
          # issue #22 hit error_max_turns one tool call after finishing just
          # the persistence-layer slice (schema + migration + defaults +
          # tests), having never touched the actual service/wiring/UI layers.
          # It wasn't flailing -- it read broadly and correctly, sanity-checked
          # with typecheck, then implemented that slice cleanly -- it simply
          # ran out of runway. Bumped to give a multi-layer feature a real
          # chance; still bounded against genuine runaway loops.
          claude_args: "--max-turns 75 --allowedTools Bash,Read,Write,Edit,Glob,Grep"
          # Temporary: full transcript for this verification run. Revisit once
          # the loop is trusted -- see documents/ai-managed-repo.md.
          show_full_output: true
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in this repository.

            Title: ${{ github.event.issue.title }}

            Body:
            ${{ github.event.issue.body }}

            Requirements:
            - Follow CLAUDE.md exactly, especially the layer boundary
              (decisions go in src/core/ as pure, tested logic; src/main/ stays a
              thin adapter) and the listed invariants.
            - Add tests with the change. For a bug fix, add a regression test that
              fails without the fix.
            - Run `pnpm typecheck` and `pnpm test:cov` and get them passing before
              opening a PR. The coverage gate is 95% statements/functions/lines
              and 90% branches.
            - Work on a branch named `ai/issue-${{ github.event.issue.number }}-<short-slug>`
              -- even if you create it yourself with `git checkout -b` rather than
              through any built-in branch-naming feature. This exact prefix is
              required for review and auto-merge to run on the resulting PR.
            - Open a PR whose body contains exactly `Closes #${{ github.event.issue.number }}`.
            - Do not modify anything under `.github/`.
            - If the issue is too vague to implement without guessing, do NOT open
              a PR. Post a comment on the issue asking the specific question that
              blocks you, and stop.
        env:
          # Subscription auth. Deliberately NOT ANTHROPIC_API_KEY — see
          # documents/ai-managed-repo.md.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Reflect the outcome in labels so issue state is visible at a glance.
      - name: Label outcome
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.implement.outcome }}
        shell: bash
        run: |
          gh issue edit "$NUMBER" --remove-label "ai:working" || true
          # steps.implement.outcome is a coarse success/failure signal. A run
          # that fully finishes -- PR opened, tests passing -- but then runs
          # out of turns before it can print a wrap-up message reports
          # "failure" here even though real, mergeable work exists: confirmed
          # on issue #23/PR #24, where `gh pr create` completed 4 seconds
          # before error_max_turns fired, and this step's old logic labeled
          # the issue "did not complete" regardless. Check for an actual PR
          # referencing this issue before trusting OUTCOME.
          pr_number=$(gh pr list --state open --json number,body --jq \
            --arg n "$NUMBER" '[.[] | select(.body // "" | test("Closes #" + $n + "(\\D|$)"))] | .[0].number // empty')
          if [ -n "$pr_number" ] || [ "$OUTCOME" = "success" ]; then
            gh issue edit "$NUMBER" --add-label "ai:pr-open" || true
          else
            gh issue edit "$NUMBER" --add-label "needs-human" || true
            gh issue comment "$NUMBER" --body \
              "The autonomous implement run did not complete, and no PR was found referencing this issue. See the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Labeled \`needs-human\`; no further automatic attempts."
          fi
